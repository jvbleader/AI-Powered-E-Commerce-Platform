name: AI-POWERED-E-COMMERCE-PLATFORM

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT}:${MYSQL_PORT}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.19.19
    restart: unless-stopped
    environment:
      discovery.type: ${ES_DISCOVERY_TYPE}
      xpack.security.enabled: ${ES_XPACK_SECURITY_ENABLED}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS}
    ports:
      - "${ES_HOST_PORT}:${ES_PORT}"
    volumes:
      - es_data:/usr/share/elasticsearch/data
      - ./backend/app/search/synonyms:/usr/share/elasticsearch/config/synonyms
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${ES_PORT}/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  db-migrate:
    image: ai-ecommerce-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
      INIT_DB_ON_START: "false"
    entrypoint: ["python", "scripts/migrate_db.py"]

  backend:
    image: ai-ecommerce-backend:prod
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env
      - ./backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}
      ELASTICSEARCH_URL: http://${ES_HOST}:${ES_PORT}
      FRONTEND_URL: http://localhost:${FRONTEND_HOST_PORT}
      CORS_ORIGINS: http://localhost:${FRONTEND_HOST_PORT},http://127.0.0.1:${FRONTEND_HOST_PORT}
      INIT_DB_ON_START: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT}/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: ai-ecommerce-frontend:prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT}
        NEXT_PUBLIC_AUTH_BASE_PATH: ${NEXT_PUBLIC_AUTH_BASE_PATH}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
      - ./frontend/.env
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT}
      INTERNAL_API_BASE_URL: http://${BACKEND_HOST}:${BACKEND_PORT}
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:${FRONTEND_PORT}').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  mysql_data:
  es_data:
