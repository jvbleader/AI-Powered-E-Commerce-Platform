name: AI-POWERED-E-COMMERCE-PLATFORM

services:
  mysql:
    image: mysql:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_db}
      MYSQL_USER: ${MYSQL_USER:-ecommerce_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ecommerce_password}
    ports:
      - "${MYSQL_PORT:-3308}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:alpine
    restart: unless-stopped

  backend:
    image: ai-ecommerce-backend:prod
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c 'if [ "$${INIT_DB_ON_START:-true}" = "true" ]; then alembic upgrade head; python -c "import asyncio, importlib, pkgutil, models; from core.database import engine; from models.base import Base; [importlib.import_module(f\"models.{m.name}\") for m in pkgutil.iter_modules(models.__path__) if m.name != \"base\" and not m.name.startswith(\"_\")]; ns = {\"engine\": engine, \"Base\": Base}; exec(\"async def init_db():\n    async with engine.begin() as conn:\n        await conn.run_sync(Base.metadata.create_all)\n    await engine.dispose()\", ns); asyncio.run(ns[\"init_db\"]())"; fi; exec python -m uvicorn app.main:app --host 0.0.0.0 --port $${PORT:-8000}'
    environment:
      APP_ENV: production
      PYTHONPATH: /app/app:/app
      PORT: "8000"
      INIT_DB_ON_START: ${INIT_DB_ON_START:-true}
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-ecommerce_user}:Phamhai271105%40@mysql:3306/${MYSQL_DATABASE:-ecommerce_db}
      ASYNC_DATABASE_URL: mysql+asyncmy://${MYSQL_USER:-ecommerce_user}:Phamhai271105%40@mysql:3306/${MYSQL_DATABASE:-ecommerce_db}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-dev-access-token-secret-change-me}
      TOKEN_HASH_PEPPER: ${TOKEN_HASH_PEPPER:-dev-token-hash-pepper-change-me}
      ACCESS_TOKEN_TTL_MINUTES: ${ACCESS_TOKEN_TTL_MINUTES:-15}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      COOKIE_SECURE: ""
      COOKIE_SAME_SITE: lax
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-3001}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3001},http://127.0.0.1:${FRONTEND_PORT:-3001}
      DEV_AUTH_DEBUG: ${DEV_AUTH_DEBUG:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-Shepoo}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-10}
      EMAIL_VERIFYCATION_TOKEN_EXPIRE_MINUTES: ${EMAIL_VERIFYCATION_TOKEN_EXPIRE_MINUTES:-10}
      PASSWORD_RESET_TOKEN_TTL_MINUTES: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:-30}
      PHONE_OTP_TTL_MINUTES: ${PHONE_OTP_TTL_MINUTES:-5}
      PHONE_OTP_MAX_ATTEMPTS: ${PHONE_OTP_MAX_ATTEMPTS:-5}
      LOG_LEVEL: INFO
      API_KEY: ${API_KEY:-}
      BASE_URL: ${BASE_URL:-}
      MODEL: ${MODEL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    image: ai-ecommerce-frontend:prod
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    command: sh -c "npm run build && npm start"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8001}
      INTERNAL_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_AUTH_BASE_PATH: /auth
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

volumes:
  mysql_data:
