name: AI-POWERED-E-COMMERCE-PLATFORM-DEV

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT}:${MYSQL_PORT}"
    volumes:
      - mysql_data_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: elasticsearch:8.19.19
    restart: unless-stopped
    environment:
      discovery.type: ${ES_DISCOVERY_TYPE}
      xpack.security.enabled: ${ES_XPACK_SECURITY_ENABLED}
      ES_JAVA_OPTS: ${ES_JAVA_OPTS}
    ports:
      - "${ES_HOST_PORT}:${ES_PORT}"
    volumes:
      - es_data_dev:/usr/share/elasticsearch/data
      - ./backend/app/search/synonyms:/usr/share/elasticsearch/config/synonyms
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:${ES_PORT}/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  # One-shot: bootstrap/upgrade schema before seed.
  # Fresh DB: create_all from models + alembic stamp head
  # Existing DB: alembic upgrade head
  db-migrate:
    image: ai-ecommerce-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: "no"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
      INIT_DB_ON_START: "false"
    volumes:
      - ./backend:/app
    entrypoint: ["python", "scripts/migrate_db.py"]

  # One-shot: load seed into MySQL using the official mysql client image.
  db-seed:
    image: mysql:8.0
    restart: "no"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      SEED_SQL_PATH: /seed/ecommerce_db_backup_20260811_224740.sql
    volumes:
      - ./database/seed:/seed:ro
    entrypoint: ["/bin/bash", "/seed/seed.sh"]

  backend:
    image: ai-ecommerce-backend:dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      db-seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - .env
      - ./backend/.env
    environment:
      DATABASE_URL: mysql+asyncmy://${MYSQL_USER}:${MYSQL_PASSWORD}@${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
      REDIS_URL: redis://${REDIS_HOST}:${REDIS_PORT}/${REDIS_DB}
      ELASTICSEARCH_URL: http://${ES_HOST}:${ES_PORT}
      FRONTEND_URL: http://localhost:${FRONTEND_HOST_PORT}
      CORS_ORIGINS: http://localhost:${FRONTEND_HOST_PORT},http://127.0.0.1:${FRONTEND_HOST_PORT}
      INIT_DB_ON_START: "false"
    volumes:
      - ./backend:/app
      - ./database/seed/vector_cache.jsonl:/app/vector_cache.jsonl:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT}/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  frontend:
    image: ai-ecommerce-frontend:dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    env_file:
      - .env
      - ./frontend/.env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_HOST_PORT}
      INTERNAL_API_BASE_URL: http://${BACKEND_HOST}:${BACKEND_PORT}
    volumes:
      - ./frontend:/app
      - frontend_node_modules_dev:/app/node_modules
      - frontend_next_dev:/app/.next
    ports:
      - "${FRONTEND_HOST_PORT}:${FRONTEND_PORT}"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:${FRONTEND_PORT}').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s

volumes:
  mysql_data_dev:
  es_data_dev:
  frontend_node_modules_dev:
  frontend_next_dev:
