# ==============================================================================
# Upstream Definitions with Connection Keepalive
# ==============================================================================
upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

# ==============================================================================
# WebSocket Upgrade Mapping
# ==============================================================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ==============================================================================
# HTTP → HTTPS Redirect + Let's Encrypt ACME Challenge
# ==============================================================================
server {
    listen 80;
    server_name shepoo.id.vn www.shepoo.id.vn;

    # Let's Encrypt certificate verification
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ==============================================================================
# HTTPS Server — SSL Termination + Reverse Proxy
# Route: /api/* → Backend (FastAPI)    |    /* → Frontend (Next.js)
# ==============================================================================
server {
    listen 443 ssl;
    http2 on;
    server_name shepoo.id.vn www.shepoo.id.vn;

    # ------------------------------------------------------------------
    # SSL Certificates (Let's Encrypt / Certbot)
    # ------------------------------------------------------------------
    ssl_certificate /etc/letsencrypt/live/shepoo.id.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shepoo.id.vn/privkey.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (ngăn downgrade attack)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # Maximum file upload size (Images, Product assets)
    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ------------------------------------------------------------------
    # Backend API — strip /api prefix, proxy to FastAPI
    # /api/health  →  backend:8000/health
    # /api/users   →  backend:8000/users
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_upstream/;
        proxy_http_version 1.1;

        # WebSocket support (Chat, Realtime Notifications)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for AI Chat Streaming & Long-running requests
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # ------------------------------------------------------------------
    # Next.js Static Asset Caching (immutable hashed filenames)
    # ------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ------------------------------------------------------------------
    # Frontend Next.js Pages & SSR (catch-all)
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Health check endpoint
    # ------------------------------------------------------------------
    location = /nginx-health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
