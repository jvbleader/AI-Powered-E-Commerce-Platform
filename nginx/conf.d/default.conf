# ==============================================================================
# Upstream Definitions with Connection Keepalive
# ==============================================================================
upstream frontend_upstream {
    server frontend:3000;
    keepalive 32;
}

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

# ==============================================================================
# WebSocket Upgrade Mapping
# ==============================================================================
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ==============================================================================
# Single Server Block — Catch-all (IP access, no domain required)
# Route: /api/* → Backend (FastAPI)    |    /* → Frontend (Next.js)
# ==============================================================================
server {
    listen 80;
    server_name _;

    # Maximum file upload size (Images, Product assets)
    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # ------------------------------------------------------------------
    # Backend API — strip /api prefix, proxy to FastAPI
    # /api/health  →  backend:8000/health
    # /api/users   →  backend:8000/users
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_upstream/;
        proxy_http_version 1.1;

        # WebSocket support (Chat, Realtime Notifications)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for AI Chat Streaming & Long-running requests
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    # ------------------------------------------------------------------
    # Next.js Static Asset Caching (immutable hashed filenames)
    # ------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ------------------------------------------------------------------
    # Frontend Next.js Pages & SSR (catch-all)
    # ------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------------------------
    # Health check endpoint for external monitoring
    # ------------------------------------------------------------------
    location = /nginx-health {
        access_log off;
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
